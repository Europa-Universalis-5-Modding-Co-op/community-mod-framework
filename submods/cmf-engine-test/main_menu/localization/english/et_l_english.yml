 ET_SECTION_CC: "GUI String Append Cost (218-224)"
 ET_CC_INSTRUCTIONS: "Each tier appends a 119-character fragment ten times per item: 10 appends at Verify, 1,800 at 1.8k, 7,200 at 7.2k and 28,800 at 28.8k. Arm one tier, press Reset Buffer, then time Grow and Fixed separately - Fixed does the same work against a buffer that never grows and is the control. Press Submit after a Grow to run the buffer as one console command; the row below reports how many of the appended statements were in it."
 ET_CC_RESET: "Reset Buffer"
 ET_CC_RESET_TOOLTIP: "Seed the buffer with the command header that zeroes the counter. Press before every Grow."
 ET_CC_SUBMIT: "Submit Buffer"
 ET_CC_SUBMIT_TOOLTIP: "Close the buffer and run it as one console command. Singleplayer only."
 ET_CC_ARM_V: "Arm Verify"
 ET_CC_ARM_A: "Arm 1.8k"
 ET_CC_ARM_B: "Arm 7.2k"
 ET_CC_ARM_C: "Arm 28.8k"
 ET_CC_ARM_TOOLTIP: "Instantiate this tier's items. Arming one tier disarms the others."
 ET_CC_GROW: "Grow"
 ET_CC_GROW_TOOLTIP: "Append the fragment once per state on the armed tier, each append reading and rewriting the whole buffer."
 ET_CC_FIXED: "Fixed"
 ET_CC_FIXED_TOOLTIP: "The control - the same states, the same reads and writes, against a source that never grows."
