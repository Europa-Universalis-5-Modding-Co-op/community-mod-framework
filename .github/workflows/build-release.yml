name: Publish Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish on Workshop'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      workshop-id:
        description: 'Workshop Identifier'
        required: false
        default: '3692202776'
        type: string
      upload-workshop-pages:
        description: 'Upload translated Workshop pages'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      upload-change-notes:
        description: 'Upload change notes'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      upload-submods:
        description: 'Upload submods'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  check:
    name: "Check Version"
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.gate.outputs.should-release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

        # Honor tools/config.toml upload_only_on_version_change
      - name: Check Version Change
        id: gate
        run: |
          VERSION=$(jq -r .version .metadata/metadata.json)
          ONLY_ON_CHANGE=$(python3 -c "import tomllib; print('true' if tomllib.load(open('tools/config.toml','rb')).get('upload_only_on_version_change', False) else 'false')")
          LAST_RELEASED=$(jq -r '.entries["main:release"] // ""' tools/dependencies/.upload_versions.json 2>/dev/null || echo "")
          if [ "$ONLY_ON_CHANGE" = "true" ] && [ "$VERSION" = "$LAST_RELEASED" ]; then
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            echo "# Release Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Version **$VERSION** was already released; skipping because upload_only_on_version_change is enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: "Publish Release"
    needs: check
    if: ${{ needs.check.outputs.should-release == 'true' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune --unshallow --tags

        # Read version from metadata.json
        # Find latest tag for changelog range (falls back to first commit)
      - name: Get Version
        id: project
        run: |
          VERSION=$(jq -r .version .metadata/metadata.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          LAST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "last-tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "# Version" >> $GITHUB_STEP_SUMMARY
          echo "**$VERSION**" >> $GITHUB_STEP_SUMMARY

        # Collect commits since the last tag
      - name: Collect Changes
        run: |
          echo "# Commits" >> $GITHUB_STEP_SUMMARY
          echo "$(git log ${{ steps.project.outputs.last-tag }}..HEAD --no-merges --pretty=format:' - %s')" >> $GITHUB_STEP_SUMMARY

        # Extract this version's section from change-notes.bbcode
        # Convert bbcode to markdown for the GitHub release body
      - name: Collect Change Notes
        id: changenotes
        run: |
          VERSION="${{ steps.project.outputs.version }}"
          NOTES=""
          if [ -f "assets/workshop/change-notes.bbcode" ]; then
            NOTES=$(awk -v ver="$VERSION" '
              BEGIN { found=0; body="" }
              {
                stripped = $0
                gsub(/^[[:space:]]+/, "", stripped)
                gsub(/[[:space:]]+$/, "", stripped)
              }
              stripped ~ /^(#[[:space:]]+v|\[b\]v)/ {
                if (found) exit
                is_bb = (stripped ~ /^\[b\]/)
                v = stripped
                if (is_bb) {
                  sub(/^\[b\]v/, "", v)
                  sub(/\[\/b\]$/, "", v)
                } else {
                  sub(/^#[[:space:]]+v/, "", v)
                }
                sub(/:?[[:space:]]*$/, "", v)
                if (v == ver) found = 1
                next
              }
              found { body = body $0 "\n" }
              END {
                if (!found) exit
                sub(/[[:space:]]+$/, "", body)
                printf "%s", body
              }
            ' assets/workshop/change-notes.bbcode)
            NOTES=$(printf '%s' "$NOTES" \
              | sed -E 's/\[b\]([^][]*)\[\/b\]/**\1**/g' \
              | sed -E 's/\[url=([^][]*)\]([^][]*)\[\/url\]/[\2](\1)/g' \
              | sed "s/\\\$item-id\\\$/${{ inputs.workshop-id }}/g")
          fi
          {
            echo 'markdown<<EOF'
            printf '%s\n' "$NOTES"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "# Change Notes" >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "$NOTES" >> $GITHUB_STEP_SUMMARY

        # Tag the current commit with the version from metadata.json
      - name: Create Tag
        run: |
          git tag ${{ steps.project.outputs.version }}
          git push origin ${{ steps.project.outputs.version }}

        # Stage release files: copy mod content into a clean folder
        # Strip Dev suffixes from metadata and swap in release thumbnail
      - name: Build Release
        run: |
          mkdir ../steam-release
          cp assets/workshop/workshop-description.bbcode ../steam-release/
          mkdir ../mod-release
          cp -r .metadata ../mod-release/
          cp -r in_game ../mod-release/
          cp -r loading_screen ../mod-release/
          cp -r main_menu ../mod-release/
          jq --tab '.name |= rtrimstr(" Dev") | .id |= rtrimstr(".dev")' ../mod-release/.metadata/metadata.json > tmp.json && mv tmp.json ../mod-release/.metadata/metadata.json
          if [ -f .metadata/thumbnail-release.png ]; then
            cp .metadata/thumbnail-release.png ../mod-release/.metadata/thumbnail.png
            rm ../mod-release/.metadata/thumbnail-release.png
          fi

        # Package clean mod folder into a zip file
      - name: Create Release Artifact
        run: |
          cd ../mod-release
          zip -r ${{ github.workspace }}/community-mod-framework-${{ steps.project.outputs.version }}.zip .

        # Package the dependency check template as a separate zip
        # Mod authors unzip this into their mod folder to get the CMF dependency popup
      - name: Create Dependency Check Artifact
        run: |
          mkdir -p ../dep-check/main_menu/gui
          cp submods/cmf-example-mod/main_menu/gui/cmf_dependency_check.gui ../dep-check/main_menu/gui/
          cd ../dep-check
          zip -r ${{ github.workspace }}/cmf-dependency-check.zip .

        # Attach mod package to the workflow run
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release
          path: community-mod-framework-${{ steps.project.outputs.version }}.zip

        # Create a GitHub release
        # Includes the mod package and visual editor tool
      - name: Publish GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          files: |
            community-mod-framework-${{ steps.project.outputs.version }}.zip
            cmf-dependency-check.zip
            tools/cmm-visual-editor.bat
          tag_name: ${{ steps.project.outputs.version }}
          name: ${{ steps.project.outputs.version }}
          body: |
            ${{ steps.changenotes.outputs.markdown }}

            **Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.project.outputs.last-tag }}...${{ steps.project.outputs.version }}

        # Create mod metadata for the steam release
        # Generate VDF inline for SteamCMD workshop upload
        # Report: Generated metadata
      - name: Create Workshop Metadata
        if: ${{ inputs.publish == 'true' }}
        id: metadata
        shell: bash
        run: |
          # Escape backslashes for VDF; substitute " with ' since SteamCMD's
          # workshop_build_item VDF parser truncates at " even when escaped as \".
          vdf_escape() {
            printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/'\''/g'
          }
          MOD_RELEASE=$(realpath ../mod-release)
          TITLE=$(grep -Po '(?<=\s"name":\s").+(?=",)' ../mod-release/.metadata/metadata.json)
          CHANGE_NOTE=""
          if [ "${{ inputs.upload-change-notes }}" = "true" ] && [ -f "assets/workshop/change-notes.bbcode" ]; then
            VERSION="${{ steps.project.outputs.version }}"
            CHANGE_NOTE=$(awk -v ver="$VERSION" '
              BEGIN { found=0; body=""; has_colon=0; is_bb=0 }
              {
                stripped = $0
                gsub(/^[[:space:]]+/, "", stripped)
                gsub(/[[:space:]]+$/, "", stripped)
              }
              stripped ~ /^(#[[:space:]]+v|\[b\]v)/ {
                if (found) exit
                is_bb = (stripped ~ /^\[b\]/)
                v = stripped
                if (is_bb) {
                  sub(/^\[b\]v/, "", v)
                  sub(/\[\/b\]$/, "", v)
                } else {
                  sub(/^#[[:space:]]+v/, "", v)
                }
                sub(/:?[[:space:]]*$/, "", v)
                if (v == ver) {
                  found = 1
                  has_colon = (stripped ~ /:/)
                }
                next
              }
              found { body = body $0 "\n" }
              END {
                if (!found) exit
                sub(/[[:space:]]+$/, "", body)
                if (is_bb || has_colon) {
                  colon = ""
                  if (has_colon) colon = ":"
                  header = "[b]v" ver colon "[/b]"
                  if (body != "") printf "%s\n%s", header, body
                  else printf "%s", header
                } else {
                  if (body != "") printf "%s", body
                }
              }
            ' assets/workshop/change-notes.bbcode)
            CHANGE_NOTE=$(echo "$CHANGE_NOTE" | sed "s/\\\$item-id\\\$/${{ inputs.workshop-id }}/g")
          fi
          {
            echo '"workshopitem"'
            echo '{'
            printf '\t"appid" "3450310"\n'
            printf '\t"publishedfileid" "%s"\n' "${{ inputs.workshop-id }}"
            printf '\t"contentfolder" "%s"\n' "${MOD_RELEASE}"
            printf '\t"previewfile" "%s/.metadata/thumbnail.png"\n' "${MOD_RELEASE}"
            printf '\t"title" "%s"\n' "$(vdf_escape "${TITLE}")"
            [ -n "$CHANGE_NOTE" ] && printf '\t"changenote" "%s"\n' "$(vdf_escape "${CHANGE_NOTE}")"
            echo '}'
          } > ../steam-release/workshop.vdf
          echo "vdf=$(realpath ../steam-release/workshop.vdf)" >> "$GITHUB_OUTPUT"
          echo "# Workflow Metadata" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat ../steam-release/workshop.vdf >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Setup SteamCMD
        if: ${{ inputs.publish == 'true' }}
        uses: CyberAndrii/setup-steamcmd@v1

        # Publish to steam workshop
        # Uses generated metadata and configured workshop user
      - name: Publish to Workshop
        if: ${{ inputs.publish == 'true' }}
        shell: bash
        run: |
          steamcmd +login ${{ secrets.WORKSHOP_USERNAME }} ${{ secrets.WORKSHOP_PASSWORD }} +workshop_build_item ${{ steps.metadata.outputs.vdf }} +quit

        # Upload translated Workshop titles and descriptions per language
        # Uses VDF 'language' field for per-language metadata updates
      - name: Upload Workshop Pages
        if: ${{ inputs.publish == 'true' && inputs.upload-workshop-pages == 'true' }}
        shell: bash
        run: |
          WORKSHOP_ID="${{ inputs.workshop-id }}"
          declare -A LANG_MAP=(
            [english]=english [french]=french [german]=german [spanish]=spanish
            [polish]=polish [russian]=russian [simp_chinese]=schinese
            [turkish]=turkish [braz_por]=brazilian [japanese]=japanese [korean]=koreana
          )
          # Escape backslashes for VDF; substitute " with ' since SteamCMD's
          # workshop_build_item VDF parser truncates at " even when escaped as \".
          vdf_escape() {
            printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/'\''/g'
          }
          write_page_vdf() {
            local vdf_path="$1" steam_lang="$2" title="$3" desc="$4"
            title=$(vdf_escape "$title")
            desc=$(vdf_escape "$desc")
            {
              echo '"workshopitem"'
              echo '{'
              printf '\t"appid" "3450310"\n'
              printf '\t"publishedfileid" "%s"\n' "${WORKSHOP_ID}"
              [ -n "$title" ] && printf '\t"title" "%s"\n' "$title"
              [ -n "$desc" ] && printf '\t"description" "%s"\n' "$desc"
              printf '\t"language" "%s"\n' "$steam_lang"
              echo '}'
            } > "$vdf_path"
          }
          upload_count=0
          # Source language page
          SOURCE_TITLE=$(jq -r '.name' ../mod-release/.metadata/metadata.json)
          SOURCE_DESC=$(sed '/--NO-TRANSLATE-BELOW--/d' assets/workshop/workshop-description.bbcode | sed "s/\\\$item-id\\\$/${WORKSHOP_ID}/g")
          write_page_vdf "../steam-release/page-english.vdf" "english" "$SOURCE_TITLE" "$SOURCE_DESC"
          echo "Uploading Workshop page for english..."
          steamcmd +login ${{ secrets.WORKSHOP_USERNAME }} ${{ secrets.WORKSHOP_PASSWORD }} +workshop_build_item "$(realpath ../steam-release/page-english.vdf)" +quit
          upload_count=$((upload_count + 1))
          # Translated pages
          for file in assets/workshop/translations/workshop_*.txt; do
            [ -f "$file" ] || continue
            LANG=$(basename "$file" | sed 's/workshop_\(.*\)\.txt/\1/')
            STEAM_LANG="${LANG_MAP[$LANG]:-}"
            if [ -z "$STEAM_LANG" ]; then
              echo "::warning::No Steam language mapping for '${LANG}', skipping."
              continue
            fi
            TRANS_TITLE=$(awk '/^===WORKSHOP_TITLE===$/{f=1;next} /^===WORKSHOP_DESCRIPTION===$/{exit} f{print}' "$file" | sed '/^[[:space:]]*$/d' | head -1)
            TRANS_TITLE=$(echo "$TRANS_TITLE" | sed "s/\\\$item-id\\\$/${WORKSHOP_ID}/g")
            TRANS_DESC=$(awk '/^===WORKSHOP_DESCRIPTION===$/{f=1;next} f{print}' "$file")
            TRANS_DESC=$(echo "$TRANS_DESC" | sed "s/\\\$item-id\\\$/${WORKSHOP_ID}/g")
            [ -z "$TRANS_TITLE" ] && [ -z "$TRANS_DESC" ] && continue
            write_page_vdf "../steam-release/page-${LANG}.vdf" "$STEAM_LANG" "$TRANS_TITLE" "$TRANS_DESC"
            echo "Uploading Workshop page for ${LANG} (${STEAM_LANG})..."
            steamcmd +login ${{ secrets.WORKSHOP_USERNAME }} ${{ secrets.WORKSHOP_PASSWORD }} +workshop_build_item "$(realpath "../steam-release/page-${LANG}.vdf")" +quit
            upload_count=$((upload_count + 1))
          done
          echo "# Workshop Pages" >> $GITHUB_STEP_SUMMARY
          echo "Uploaded **${upload_count}** Workshop page(s)." >> $GITHUB_STEP_SUMMARY

        # Upload submods with Workshop IDs configured in tools/config.toml
      - name: Upload Submods
        if: ${{ inputs.publish == 'true' && inputs.upload-submods == 'true' }}
        shell: bash
        run: |
          # Escape backslashes for VDF; substitute " with ' since SteamCMD's
          # workshop_build_item VDF parser truncates at " even when escaped as \".
          vdf_escape() {
            printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/'\''/g'
          }
          parse_change_note() {
            local file="$1" version="$2" item_id="$3"
            [ -f "$file" ] || return
            local note
            note=$(awk -v ver="$version" '
              BEGIN { found=0; body=""; has_colon=0; is_bb=0 }
              {
                stripped = $0
                gsub(/^[[:space:]]+/, "", stripped)
                gsub(/[[:space:]]+$/, "", stripped)
              }
              stripped ~ /^(#[[:space:]]+v|\[b\]v)/ {
                if (found) exit
                is_bb = (stripped ~ /^\[b\]/)
                v = stripped
                if (is_bb) {
                  sub(/^\[b\]v/, "", v)
                  sub(/\[\/b\]$/, "", v)
                } else {
                  sub(/^#[[:space:]]+v/, "", v)
                }
                sub(/:?[[:space:]]*$/, "", v)
                if (v == ver) {
                  found = 1
                  has_colon = (stripped ~ /:/)
                }
                next
              }
              found { body = body $0 "\n" }
              END {
                if (!found) exit
                sub(/[[:space:]]+$/, "", body)
                if (is_bb || has_colon) {
                  colon = ""
                  if (has_colon) colon = ":"
                  header = "[b]v" ver colon "[/b]"
                  if (body != "") printf "%s\n%s", header, body
                  else printf "%s", header
                } else {
                  if (body != "") printf "%s", body
                }
              }
            ' "$file")
            [ -n "$note" ] && echo "$note" | sed "s/\\\$item-id\\\$/${item_id}/g"
          }
          SUBMODS=$(python3 -c "
          import tomllib, json
          with open('tools/config.toml', 'rb') as f:
              config = tomllib.load(f)
          for s in config.get('submods', []):
              mod_id = s.get('mod_id', '')
              wid = int(s.get('workshop_id', 0))
              if mod_id and wid > 0:
                  print(json.dumps({'mod_id': mod_id, 'workshop_id': wid}))
          ")
          if [ -z "$SUBMODS" ]; then
            echo "No submods configured for upload."
            echo "# Submods" >> $GITHUB_STEP_SUMMARY
            echo "No submods configured." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          upload_count=0
          while IFS= read -r entry; do
            MOD_ID=$(echo "$entry" | jq -r '.mod_id')
            WID=$(echo "$entry" | jq -r '.workshop_id')
            SUBMOD_DIR=""
            for dir in submods/*/; do
              [ -d "$dir" ] || continue
              if [ -f "${dir}.metadata/metadata.json" ]; then
                DIR_MOD_ID=$(jq -r '.id // empty' "${dir}.metadata/metadata.json")
                if [ "$DIR_MOD_ID" = "$MOD_ID" ]; then
                  SUBMOD_DIR="$dir"
                  break
                fi
              fi
            done
            if [ -z "$SUBMOD_DIR" ]; then
              echo "::warning::Submod '${MOD_ID}' not found in submods/. Skipping."
              continue
            fi
            SUBMOD_NAME=$(jq -r '.name // empty' "${SUBMOD_DIR}.metadata/metadata.json")
            SUBMOD_VERSION=$(jq -r '.version // empty' "${SUBMOD_DIR}.metadata/metadata.json")
            SUBMOD_RELEASE=$(realpath "$SUBMOD_DIR")
            PREVIEW_PATH=""
            if [ -f "${SUBMOD_DIR}.metadata/thumbnail.png" ]; then
              PREVIEW_PATH=$(realpath "${SUBMOD_DIR}.metadata/thumbnail.png")
            fi
            CHANGE_NOTE=""
            if [ "${{ inputs.upload-change-notes }}" = "true" ] && [ -n "$SUBMOD_VERSION" ]; then
              CHANGE_NOTE=$(parse_change_note "${SUBMOD_DIR}workshop/change-notes.bbcode" "$SUBMOD_VERSION" "$WID")
            fi
            {
              echo '"workshopitem"'
              echo '{'
              printf '\t"appid" "3450310"\n'
              printf '\t"publishedfileid" "%s"\n' "$WID"
              printf '\t"contentfolder" "%s"\n' "${SUBMOD_RELEASE}"
              [ -n "$PREVIEW_PATH" ] && printf '\t"previewfile" "%s"\n' "${PREVIEW_PATH}"
              [ -n "$SUBMOD_NAME" ] && printf '\t"title" "%s"\n' "$(vdf_escape "${SUBMOD_NAME}")"
              [ -n "$CHANGE_NOTE" ] && printf '\t"changenote" "%s"\n' "$(vdf_escape "${CHANGE_NOTE}")"
              echo '}'
            } > "../steam-release/submod-${MOD_ID}.vdf"
            echo "Uploading submod '${MOD_ID}' (Workshop ID: ${WID})..."
            steamcmd +login ${{ secrets.WORKSHOP_USERNAME }} ${{ secrets.WORKSHOP_PASSWORD }} +workshop_build_item "$(realpath "../steam-release/submod-${MOD_ID}.vdf")" +quit
            upload_count=$((upload_count + 1))
          done <<< "$SUBMODS"
          echo "# Submods" >> $GITHUB_STEP_SUMMARY
          echo "Uploaded **${upload_count}** submod(s)." >> $GITHUB_STEP_SUMMARY

        # Update .upload_versions.json so local upload.py knows this version was published
      - name: Update Upload Versions
        if: ${{ inputs.publish == 'true' }}
        run: |
          VERSION="${{ steps.project.outputs.version }}"
          BRANCH="${{ github.ref_name }}"
          jq --indent 2 ".entries[\"main:release\"] = \"${VERSION}\"" tools/dependencies/.upload_versions.json > tmp.json && mv tmp.json tools/dependencies/.upload_versions.json
          git add tools/dependencies/.upload_versions.json
          git commit -m "Bump upload versions to ${VERSION}"
          git push origin HEAD:${BRANCH}

