name: Publish Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release Type'
        default: 'feature'
        required: false
        type: choice
        options:
          - 'major'
          - 'feature'
          - 'patch'
      publish:
        description: 'Publish on Workshop'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      workshop-id:
        description: 'Workshop Identifier'
        required: false
        default: '3691154596'
        type: string

jobs:
  release:
    name: "Publish Release"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune --unshallow --tags

        # Read current version from metadata.json
        # Find latest tag for changelog range (falls back to first commit)
      - name: Get Version
        id: project
        run: |
          echo "current-version=$(jq -r .version .metadata/metadata.json)" >> $GITHUB_OUTPUT
          LAST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "last-tag=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Increment Version
        id: increment-version
        uses: christian-draeger/increment-semantic-version@1.2.1
        with:
          current-version: ${{ steps.project.outputs.current-version }}
          version-fragment: ${{ inputs.release-type }}

        # Collect commits since the last tag
        # Format them as a Markdown list and put them into the summary
      - name: Collect Changes
        id: commits
        run: |
          {
            echo 'markdown<<EOF'
            echo "$(git log ${{ steps.project.outputs.last-tag }}..HEAD --no-merges --pretty=format:' - %s')"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "# Commits" >> $GITHUB_STEP_SUMMARY
          echo "$(git log ${{ steps.project.outputs.last-tag }}..HEAD --no-merges --pretty=format:' - %s')" >> $GITHUB_STEP_SUMMARY

        # Update version in metadata.json, commit, and tag
      - name: Update Version
        run: |
          jq --tab --arg v "${{ steps.increment-version.outputs.next-version }}" '.version = $v' .metadata/metadata.json > tmp.json && mv tmp.json .metadata/metadata.json
          git commit -am "Updated version to ${{ steps.increment-version.outputs.next-version }}"
          git tag ${{ steps.increment-version.outputs.next-version }}
          echo "# Versions" >> $GITHUB_STEP_SUMMARY
          echo "Last Version: **${{ steps.project.outputs.current-version }}**" >> $GITHUB_STEP_SUMMARY
          echo "Next Version: **${{ steps.increment-version.outputs.next-version }}**" >> $GITHUB_STEP_SUMMARY

      - name: Push Version
        run: |
          git push origin
          git push origin ${{ steps.increment-version.outputs.next-version }}

        # Stage release files: copy only mod content into a clean folder
      - name: Build Release
        run: |
          mkdir ../steam-release
          cp assets/workshop/workshop-description.bbcode ../steam-release/
          mkdir ../mod-release
          cp -r .metadata ../mod-release/
          cp -r in_game ../mod-release/
          cp -r loading_screen ../mod-release/
          cp -r main_menu ../mod-release/

        # Package clean mod folder into a zip file
      - name: Create Release Artifact
        run: |
          cd ../mod-release
          zip -r ${{ github.workspace }}/release-${{ steps.increment-version.outputs.next-version }}.zip .

        # Attach mod package to the workflow run
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release
          path: release-${{ steps.increment-version.outputs.next-version }}.zip

        # Create a GitHub release
        # Includes the mod package and visual editor tool
      - name: Publish GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          files: |
            release-${{ steps.increment-version.outputs.next-version }}.zip
            tools/cmm-visual-editor.bat
          tag_name: ${{ steps.increment-version.outputs.next-version }}
          name: ${{ steps.increment-version.outputs.next-version }}
          body: |
            Released a new version of the **Community Mod Framework**.

            ### Commits:
            ${{ steps.commits.outputs.markdown }}

        # Create mod metadata for the steam release
        # Generate VDF inline for SteamCMD workshop upload
        # Report: Generated metadata
      - name: Create Workshop Metadata
        if: ${{ inputs.publish == 'true' }}
        id: metadata
        shell: bash
        run: |
          MOD_RELEASE=$(realpath ../mod-release)
          TITLE=$(grep -Po '(?<=\s"name":\s").+(?=",)' ../mod-release/.metadata/metadata.json)
          DESCRIPTION=$(sed '/--NO-TRANSLATE-BELOW--/d' ../steam-release/workshop-description.bbcode | sed "s/\\\$item-id\\\$/${{ inputs.workshop-id }}/g")
          cat > ../steam-release/workshop.vdf <<VDFEOF
          "workshopitem"
          {
          	"appid" "3450310"
          	"publishedfileid" "${{ inputs.workshop-id }}"
          	"contentfolder" "${MOD_RELEASE}"
          	"previewfile" "${MOD_RELEASE}/.metadata/thumbnail.png"
          	"title" "${TITLE}"
          	"description" "${DESCRIPTION}"
          }
          VDFEOF
          echo "vdf=$(realpath ../steam-release/workshop.vdf)" >> "$GITHUB_OUTPUT"
          echo "# Workflow Metadata" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat ../steam-release/workshop.vdf >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Setup SteamCMD
        if: ${{ inputs.publish == 'true' }}
        uses: CyberAndrii/setup-steamcmd@v1

        # Publish to steam workshop
        # Uses generated metadata and configured workshop user
      - name: Publish to Workshop
        if: ${{ inputs.publish == 'true' }}
        shell: bash
        run: |
          steamcmd +login ${{ secrets.WORKSHOP_USERNAME }} ${{ secrets.WORKSHOP_PASSWORD }} +workshop_build_item ${{ steps.metadata.outputs.vdf }} +quit

